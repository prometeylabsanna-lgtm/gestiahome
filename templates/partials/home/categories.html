{% load content_tags %}
<section class="cats" aria-label="{% cms home_blocks.categories.title 'categories_label' %}">
  <div class="cat-rail">
    {% for cat in categories %}
      <a class="cat-card" href="{{ cat.get_absolute_url }}">
        <span class="cat-card__media">
          {% include "partials/smart_media.html" with media=cat width=303 height=342 %}
        </span>
        <span class="cat-card__name">{{ cat.name }}</span>
      </a>
    {% endfor %}
  </div>
</section>
