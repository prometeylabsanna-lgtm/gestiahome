{% load i18n %}
<section class="nd-pdp-rail {{ band_class }}"{% if rail_id %} aria-labelledby="{{ rail_id }}"{% endif %}>
  {% if title %}
    <h2 class="nd-pdp-rail__title"{% if rail_id %} id="{{ rail_id }}"{% endif %}>{{ title }}</h2>
  {% endif %}
  <ul class="nd-pdp-rail__list nd-scroll">
    {% for item in products %}
      {% include "partials/nd/product_card.html" with product=item modifier="rail" %}
    {% endfor %}
    <li class="nd-pdp-rail__spacer" aria-hidden="true"></li>
  </ul>
  {% if cta %}
    <div class="nd-pdp-rail__more">
      <a class="nd-pdp-rail__cta" href="{% url 'catalog' %}">{{ cta }}</a>
    </div>
  {% endif %}
</section>
