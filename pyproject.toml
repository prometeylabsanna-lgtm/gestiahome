# Лише метадані Vercel. Залежності — у requirements.txt
# (наявність [project].dependencies змушує uv ігнорувати requirements.txt).

[tool.vercel]
entrypoint = "config.wsgi:app"

[tool.vercel.scripts]
build = "DJANGO_BUILD_PHASE=1 DJANGO_SETTINGS_MODULE=config.settings.vercel python build_vercel.py"
