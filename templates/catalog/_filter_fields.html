{% load i18n %}
<fieldset class="nd-cat-facet">
  <legend class="nd-cat-facet__title">{% trans "Категорії" %}</legend>
  <ul class="nd-cat-facet__list">
    {% for category in filter_categories %}
      <li>
        <label class="nd-cat-check">
          <input
            class="visually-hidden"
            type="checkbox"
            name="category"
            value="{{ category.slug }}"
            {% if category.slug in parsed.categories %}checked{% endif %}
          >
          <span class="nd-cat-check__dot" aria-hidden="true"></span>
          <span class="nd-cat-check__label">{{ category.filter_label }}</span>
        </label>
      </li>
    {% endfor %}
  </ul>
</fieldset>
{% for group in filter_groups %}
  <fieldset class="nd-cat-facet{% if forloop.last %} nd-cat-facet--last{% endif %}">
    <legend class="nd-cat-facet__title">{{ group.group.name }}</legend>
    <ul class="nd-cat-facet__list">
      {% for value in group.values %}
        {% with mark=group.group.slug|add:":"|add:value.slug %}
          <li>
            <label class="nd-cat-check">
              <input
                class="visually-hidden"
                type="checkbox"
                name="{{ group.group.slug }}"
                value="{{ value.slug }}"
                {% if mark in parsed.selected %}checked{% endif %}
              >
              <span class="nd-cat-check__dot" aria-hidden="true"></span>
              <span class="nd-cat-check__label">{{ value.name }}</span>
            </label>
          </li>
        {% endwith %}
      {% endfor %}
    </ul>
  </fieldset>
{% endfor %}
