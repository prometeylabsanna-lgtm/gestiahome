{% extends "base.html" %}
{% load i18n static ui_tags %}

{% block title %}{% ui "wishlist" %}{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/nd/wishlist.css' %}">
{% endblock %}

{% block content %}
  <div class="nd-wish" data-qa="wishlist-page">
    <nav class="nd-wish__crumbs" aria-label="{% ui "crumbs" %}">
      <ol class="nd-wish__crumbs-list">
        <li>
          <a href="{% url 'home' %}">{% ui "crumb_home" %}</a>
          <span aria-hidden="true">/</span>
        </li>
        <li aria-current="page">{% ui "wishlist" %}</li>
      </ol>
    </nav>
    <div id="wish-body">
      {% include "commerce/_wishlist_body.html" %}
    </div>
  </div>
{% endblock %}
