{% load i18n richtext %}
{% if discount_modal and discount_modal.enabled %}
<div
  class="waitlist-modal"
  id="waitlist-modal"
  hidden
  data-waitlist-modal
  data-delay-ms="{{ discount_modal.delay_ms }}"
  data-storage-key="gestia_waitlist_modal_seen"
  data-started-key="gestia_waitlist_site_started_at"
>
  <div class="waitlist-modal__scrim" data-waitlist-close tabindex="-1" aria-hidden="true"></div>
  <div
    class="waitlist-modal__panel{% if discount_modal.shows_video or discount_modal.image %} waitlist-modal__panel--photo{% endif %}{% if discount_modal.shows_video %} waitlist-modal__panel--video{% endif %}"
    role="dialog"
    aria-modal="true"
    aria-labelledby="waitlist-modal-title"
    aria-describedby="waitlist-modal-text"
    {% if discount_modal.image and not discount_modal.shows_video %}style="--waitlist-bg: url('{{ discount_modal.image.url }}')"{% endif %}
  >
    {% if discount_modal.shows_video %}
      <video
        class="waitlist-modal__bg-video"
        autoplay muted loop playsinline preload="metadata"
        {% if discount_modal.poster_src %}poster="{{ discount_modal.poster_src }}"{% endif %}
        aria-hidden="true"
      >
        <source src="{{ discount_modal.video.url }}" type="{% if '.webm' in discount_modal.video.name %}video/webm{% else %}video/mp4{% endif %}">
      </video>
    {% endif %}
    <button class="waitlist-modal__close" type="button" data-waitlist-close aria-label="{% trans 'Закрити' %}">
      <span aria-hidden="true">×</span>
    </button>
    <div class="waitlist-modal__body" id="waitlist-modal-body">
      <div class="waitlist-modal__text" id="waitlist-modal-text">
        <div id="waitlist-modal-title" class="visually-hidden">{% trans "Знижка" %}</div>
        {{ discount_modal.text|richhtml }}
      </div>
      <div id="waitlist-form-slot">
        {% include "partials/home/_waitlist_form.html" with waitlist_form=waitlist_form %}
      </div>
    </div>
  </div>
</div>
{% endif %}
