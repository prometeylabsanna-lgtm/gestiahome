{% load i18n %}
<div class="nd-cat-sort{% if compact %} nd-cat-sort--compact{% endif %}" data-nd-sort>
  <button
    class="nd-cat-sort__btn"
    type="button"
    data-nd-sort-open
    aria-expanded="false"
    aria-haspopup="listbox"
    aria-controls="{{ menu_id }}"
  >
    <span data-nd-sort-label>
      {% if parsed.sort == "price_asc" %}
        {% trans "Ціна: за зростанням" %}
      {% elif parsed.sort == "price_desc" %}
        {% trans "Ціна: за спаданням" %}
      {% elif parsed.sort == "name" %}
        {% trans "Назва: А–Я" %}
      {% else %}
        {% trans "Сортувати за" %}
      {% endif %}
    </span>
    <span class="nd-cat-sort__chev" aria-hidden="true">
      {% include "partials/nd/icons/chevron.html" with size=10 %}
    </span>
  </button>
  <ul class="nd-cat-sort__menu" id="{{ menu_id }}" role="listbox" hidden data-nd-sort-menu aria-label="{% trans 'Сортування' %}">
    <li role="option" {% if not parsed.sort %}aria-selected="true"{% endif %}>
      <button type="button" data-nd-sort-value=""{% if not parsed.sort %} class="is-active"{% endif %}>{% trans "Сортувати за" %}</button>
    </li>
    <li role="option" {% if parsed.sort == "price_asc" %}aria-selected="true"{% endif %}>
      <button type="button" data-nd-sort-value="price_asc"{% if parsed.sort == "price_asc" %} class="is-active"{% endif %}>{% trans "Ціна: за зростанням" %}</button>
    </li>
    <li role="option" {% if parsed.sort == "price_desc" %}aria-selected="true"{% endif %}>
      <button type="button" data-nd-sort-value="price_desc"{% if parsed.sort == "price_desc" %} class="is-active"{% endif %}>{% trans "Ціна: за спаданням" %}</button>
    </li>
    <li role="option" {% if parsed.sort == "name" %}aria-selected="true"{% endif %}>
      <button type="button" data-nd-sort-value="name"{% if parsed.sort == "name" %} class="is-active"{% endif %}>{% trans "Назва: А–Я" %}</button>
    </li>
  </ul>
</div>
