{% load i18n static %}
<a class="brand brand--{{ kind }}" href="{% url 'home' %}" aria-label="{% trans 'Gestia Home — на головну' %}">
  {% if site_settings.logo %}
    <img class="brand__img" src="{{ site_settings.logo.url }}" alt="Gestia Home" width="136" height="56">
  {% else %}
    <img class="brand__img" src="{% static 'nd/logo.png' %}" alt="Gestia Home" width="136" height="56">
  {% endif %}
</a>
