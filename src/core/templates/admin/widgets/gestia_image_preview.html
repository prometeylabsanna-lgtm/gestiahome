{% load i18n %}

<div class="gestia-file">
  {% if widget.is_initial %}
    <a
      href="{{ widget.value.url }}"
      class="gestia-file__preview"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="{{ widget.value.url }}"
        alt=""
        class="gestia-admin-thumb"
      >
    </a>
    <p class="gestia-file__name" title="{{ widget.value }}">{{ widget.value }}</p>
  {% endif %}

  <div class="gestia-file__actions">
    {% if widget.is_initial and not widget.required %}
      <label class="gestia-file__clear" for="{{ widget.checkbox_id }}">
        <input
          type="checkbox"
          name="{{ widget.checkbox_name }}"
          id="{{ widget.checkbox_id }}"
          class="gestia-file__check"
        >
        <span class="gestia-file__btn gestia-file__btn--ghost">{{ widget.clear_checkbox_label }}</span>
      </label>
    {% endif %}

    <label class="gestia-file__pick" for="{{ widget.attrs.id }}">
      <span class="gestia-file__btn gestia-file__btn--solid">
        {% if widget.is_initial %}{% trans "Change" %}{% else %}{% trans "Choose file to upload" %}{% endif %}
      </span>
      <input
        type="{{ widget.type }}"
        name="{{ widget.name }}"
        class="gestia-file__input"
        {% include "django/forms/widgets/attrs.html" %}
      >
    </label>
  </div>
</div>
