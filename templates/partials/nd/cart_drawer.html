{% load i18n static %}
<div
  class="nd-cart-drawer"
  data-nd-cart-drawer
  data-panel-url="{% url 'cart_panel' %}"
  hidden
>
  <div class="nd-cart-drawer__scrim" data-nd-cart-close aria-hidden="true"></div>
  <aside
    id="nd-cart-drawer-panel"
    class="nd-cart-drawer__panel"
    role="dialog"
    aria-modal="true"
    aria-label="{% trans 'Кошик' %}"
    aria-hidden="true"
    tabindex="-1"
  >
    <div id="nd-cart-drawer-body" class="nd-cart-drawer__mount"></div>
  </aside>
</div>
